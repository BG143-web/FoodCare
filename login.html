<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FoodCare</title>
  <meta name="description" content="Sign in to your FoodCare donor or food seeker account.">

  <!-- Core Styles -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo" aria-label="FoodCare Home">
        <div class="brand-icon">🌱</div>
        <span class="brand-name">Food<span>Care</span></span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
        <li><a href="seeker-dashboard.html">Browse Food</a></li>
      </ul>

      <div class="nav-actions">
        <span style="font-size: 0.9rem; color: var(--text-muted);">New to FoodCare?</span>
        <a href="register.html" class="btn btn-outline btn-sm">Register</a>
      </div>

      <button class="mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-content auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-icon">🌱</div>
        <h1>Welcome Back</h1>
        <p>Sign in to manage surplus food donations or track requests.</p>
      </div>

      <form id="login-form" novalidate>
        
        <!-- Role Selector -->
        <div class="role-selector-group">
          <label class="role-selector-label">I am logging in as: <span class="required" style="color: var(--status-rejected);">*</span></label>
          <div class="role-options">
            <div class="role-option">
              <input type="radio" id="role-donor" name="role" value="donor" checked>
              <label for="role-donor" class="role-card-label">
                <span class="role-card-icon">🏢</span>
                <span class="role-card-title">Food Donor</span>
                <span class="role-card-desc">Restaurant, Hotel, Caterer</span>
              </label>
            </div>

            <div class="role-option">
              <input type="radio" id="role-seeker" name="role" value="seeker">
              <label for="role-seeker" class="role-card-label">
                <span class="role-card-icon">🤝</span>
                <span class="role-card-title">Food Seeker</span>
                <span class="role-card-desc">NGO, Shelter, Recipient</span>
              </label>
            </div>
          </div>
          <div class="form-error"></div>
        </div>

        <!-- Email Field -->
        <div class="form-group">
          <label for="login-email" class="form-label">
            Email Address <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="login-email" 
            name="email" 
            class="form-control" 
            placeholder="e.g. contact@greenleafbistro.com" 
            value="donor@greenleaf.org"
            required
            autocomplete="email"
          >
          <div class="form-error"></div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="login-password" class="form-label">
            Password <span class="required">*</span>
          </label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password" 
              value="demo1234"
              required
              autocomplete="current-password"
            >
            <button type="button" class="toggle-password-btn" aria-label="Show password">Show</button>
          </div>
          <div class="form-error"></div>
        </div>

        <!-- Actions Row -->
        <div class="auth-actions-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember-me" name="remember" checked>
            <span>Remember me</span>
          </label>
          <a href="#" onclick="window.showToast('Password reset instructions will be sent to your registered email.', 'info'); return false;" style="font-size: 0.88rem;">Forgot password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block btn-lg">
          Sign In
        </button>

      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register here</a>
      </div>
    </div>
  </main>

  <!-- Global Footer -->
  <footer class="footer">
    <div class="container footer-bottom" style="border-top: none; padding-top: 0;">
      <div>&copy; 2026 FoodCare Foundation. All rights reserved.</div>
      <div>
        <a href="index.html" style="color: #6ee7b7; margin-right: 1.25rem;">Home</a>
        <a href="#" style="color: #6ee7b7;">Privacy Policy</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
